name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Treasure v__VERSION__
          releaseBody: Download an installer below, or use the Windows x64 portable ZIP without installation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.tauri.outputs.appVersion }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tauri action did not report an application version.'
          }

          $binary = 'src-tauri/target/release/treasure.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Portable executable was not found at $binary"
          }

          $archive = "Treasure_${version}_windows-x64_portable.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive -CompressionLevel Optimal
          "PORTABLE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:RELEASE_TAG" "$env:PORTABLE_ARCHIVE" --clobber

  finalize-release:
    # Each matrix entry appends to the same draft release.  Only this job makes it
    # public, after the complete asset set has also been copied to Gitee.
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER || github.repository_owner }}
      GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download GitHub release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber

      - name: Generate and upload checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Mirror release assets to Gitee
        shell: bash
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?Set the GITEE_TOKEN repository secret before releasing.}"
          api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # Gitee intermittently closes long-lived TLS connections during asset
          # uploads.  Retry transient transport failures, while making retries
          # safe by checking the remote attachment list before each upload.
          curl_gitee() {
            local attempt
            for attempt in $(seq 1 3); do
              if curl --fail-with-body --silent --show-error \
                --connect-timeout 30 --max-time 45 "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              echo "Gitee request failed; retrying (${attempt}/3) in $((attempt * 5)) seconds..." >&2
              sleep $((attempt * 5))
            done
          }

          # Creating a release for an existing tag intentionally returns HTTP
          # 400 from Gitee.  Preserve that response so the fallback below can
          # look up and reuse the existing release; only retry transport errors.
          curl_gitee_allow_http_error() {
            local attempt
            for attempt in $(seq 1 3); do
              if curl --silent --show-error --connect-timeout 30 --max-time 45 "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              echo "Gitee transport request failed; retrying (${attempt}/3) in $((attempt * 5)) seconds..." >&2
              sleep $((attempt * 5))
            done
          }

          # Gitee receives source commits and tags through its GitHub pull mirror.
          # A Release cannot target a commit that the mirror has not received yet.
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${api}/commits/${GITHUB_SHA}?access_token=${GITEE_TOKEN}")
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$attempt" = "90" ]; then
              echo "Gitee has not mirrored ${GITHUB_SHA} after 15 minutes (last HTTP status: ${status})."
              exit 1
            fi
            sleep 10
          done

          # Gitee Release assets are limited to 100 MB each.  Fail before creating
          # a partial mirror; publish larger installers through an OCI/object-store
          # mirror and link it from the Release notes instead.
          if find release-assets -type f -size +100M -print -quit | grep -q .; then
            echo "A release asset exceeds Gitee's 100 MB attachment limit."
            exit 1
          fi

          payload=$(curl_gitee_allow_http_error --request POST \
            --data-urlencode "tag_name=${RELEASE_TAG}" \
            --data-urlencode "name=Treasure ${RELEASE_TAG}" \
            --data-urlencode "body=Mirrored from https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --data-urlencode "target_commitish=${GITHUB_SHA}" \
            "${api}/releases?access_token=${GITEE_TOKEN}")
          release_id=$(jq -er '.id // empty' <<<"$payload" || true)
          if [ -z "$release_id" ]; then
            payload=$(curl_gitee \
              "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}")
            release_id=$(jq -er '.id' <<<"$payload")
          fi

          for asset in release-assets/*; do
            asset_name=$(basename "$asset")
            if jq -e --arg name "$asset_name" '.assets[]? | select(.name == $name)' \
              <<<"$payload" >/dev/null; then
              echo "Gitee asset already exists; skipping: ${asset_name}"
              continue
            fi

            uploaded=false
            for attempt in $(seq 1 3); do
              if curl --fail-with-body --silent --show-error \
                --connect-timeout 30 --max-time 180 --request POST --form "file=@${asset}" \
                "${api}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}"; then
                uploaded=true
                break
              fi

              # The server can accept an upload and close the connection before
              # returning a response.  Refresh by tag before retrying so that
              # case never creates a duplicate attachment.
              payload=$(curl_gitee \
                "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}")
              if jq -e --arg name "$asset_name" '.assets[]? | select(.name == $name)' \
                <<<"$payload" >/dev/null; then
                echo "Gitee accepted the asset before disconnecting: ${asset_name}"
                uploaded=true
                break
              fi

              if [ "$attempt" != "3" ]; then
                echo "Gitee upload failed; retrying (${attempt}/3) in $((attempt * 5)) seconds..." >&2
                sleep $((attempt * 5))
              fi
            done
            if [ "$uploaded" != "true" ]; then
              echo "Gitee upload failed after 3 attempts: ${asset_name}" >&2
              exit 1
            fi

            payload=$(curl_gitee \
              "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}")
          done

      - name: Publish GitHub release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
