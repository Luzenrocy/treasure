name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Treasure v__VERSION__
          releaseBody: Download an installer below, or use the Windows x64 portable ZIP without installation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.tauri.outputs.appVersion }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tauri action did not report an application version.'
          }

          $binary = 'src-tauri/target/release/treasure.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Portable executable was not found at $binary"
          }

          $archive = "Treasure_${version}_windows-x64_portable.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive -CompressionLevel Optimal
          "PORTABLE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:RELEASE_TAG" "$env:PORTABLE_ARCHIVE" --clobber
