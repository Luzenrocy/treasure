name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Reuse an existing draft and run only the release finalization (select main)
        type: string
      replace_mismatched:
        description: Replace Gitee attachments whose SHA-256 differs from the GitHub draft
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ inputs.resume_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref_type == 'tag' && !inputs.resume_tag }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Treasure v__VERSION__
          releaseBody: Download an installer below, or use the Windows x64 portable ZIP without installation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.tauri.outputs.appVersion }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tauri action did not report an application version.'
          }

          $binary = 'src-tauri/target/release/treasure.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Portable executable was not found at $binary"
          }

          $archive = "Treasure_${version}_windows-x64_portable.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive -CompressionLevel Optimal
          "PORTABLE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:RELEASE_TAG" "$env:PORTABLE_ARCHIVE" --clobber

  finalize-release:
    # Each matrix entry appends to the same draft release.  Only this job makes it
    # public, after the complete asset set has also been copied to Gitee.
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.resume_tag) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.resume_tag || github.ref_name }}
      RESUME_TAG: ${{ inputs.resume_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ $RELEASE_TAG != v* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Select a valid version tag beginning with v." >&2
            exit 1
          fi
          git fetch --no-tags --depth 1 origin "refs/tags/$RELEASE_TAG"
          release_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ -z $RESUME_TAG && $release_sha != "$(git rev-parse HEAD)" ]]; then
            echo "The release tag changed during this build." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Download GitHub release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber

      - name: Prepare release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if find . -maxdepth 1 -type f -size +100M -print -quit | grep -q .; then
            echo "A release asset exceeds Gitee's 100 MB attachment limit." >&2
            exit 1
          fi
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          shopt -s nullglob
          for asset in *; do
            if [[ -f $asset && $asset != SHA256SUMS.txt ]]; then
              sha256sum -- "$asset"
            fi
          done > "$manifest"
          test -s "$manifest"
          if [[ -n $RESUME_TAG ]]; then
            # Previous runs could include SHA256SUMS.txt in its own manifest.
            if ! diff -q <(grep -v '  SHA256SUMS.txt$' SHA256SUMS.txt | LC_ALL=C sort) \
                         <(LC_ALL=C sort "$manifest"); then
              echo "The draft assets do not match the manifest from the last completed build." >&2
              exit 1
            fi
          fi
          if ! cmp -s "$manifest" SHA256SUMS.txt; then
            cp "$manifest" SHA256SUMS.txt
            gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Mirror release assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER || github.repository_owner }}
          GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}
          REPLACE_MISMATCHED: ${{ inputs.replace_mismatched }}
        run: bash scripts/mirror-gitee-release.sh release-assets

      - name: Publish GitHub release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
